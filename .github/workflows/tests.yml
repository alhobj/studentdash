name: Fictional workbook tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Install PDF and DOCX import dependencies
        run: python -m pip install -r archive/legacy/requirements.txt
      - name: Test assessment and ChatGPT imports
        working-directory: archive/legacy
        run: python -m unittest discover -s tests -p "test_*assessment*.py" -v
