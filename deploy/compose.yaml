name: arborsynapse-test
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${ARBOR_BIND_IP:-127.0.0.1}:5080:5080"
    environment:
      ARBOR_DEMO: "1"
      ARBOR_TEST_HOSTS: "${ARBOR_TEST_HOSTS:-atlas,atlas.local,127.0.0.1,localhost}"
    volumes:
      - sandbox:/app/data
      - output:/app/output
volumes:
  sandbox:
  output:
