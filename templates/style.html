<style>
:root{color-scheme:light;--ink:#172e3a;--muted:#516672;--line:#dbe5e7;--paper:#fff;--teal:#136d67;--bg:#f2f6f6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1120px;margin:auto;padding:40px 24px 64px}h1,h2,h3,p{margin-top:0}h1{font-size:clamp(2rem,5vw,3rem);line-height:1.15;letter-spacing:-.04em;margin-bottom:14px}h2{font-size:1.25rem;letter-spacing:-.02em}h3{font-size:1rem}a{color:var(--teal);text-underline-offset:3px}a:focus-visible,button:focus-visible,summary:focus-visible{outline:3px solid #d58b24;outline-offset:4px}.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.14em;font-weight:750;color:var(--teal);margin-bottom:14px}.muted{color:var(--muted)}.topline{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:34px}.tag{display:inline-block;padding:5px 12px;border-radius:20px;background:#dfefea;color:#125f58;font-size:.8rem;font-weight:650}.hero{background:var(--ink);color:#fff;border-radius:22px;padding:32px;margin-bottom:24px}.hero .eyebrow,.hero .muted{color:#c0e4db}.hero p{max-width:720px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:24px 0}.stat{padding:22px;border:1px solid var(--line);border-radius:16px;background:var(--paper)}.stat strong{display:block;font-size:2rem;line-height:1.25;letter-spacing:-.03em}.stat span{font-size:.85rem;color:var(--muted)}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:22px}.notice{background:#fff6e5;border-left:4px solid #bb7b19;padding:16px 20px;border-radius:8px;font-size:.9rem;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}.grid>.card{margin-bottom:0}.section{margin-top:34px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:.92rem}th{color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}td,th{padding:14px 10px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child,th:first-child{padding-left:0}progress{width:100%;height:10px;accent-color:var(--teal);border:0;border-radius:10px;overflow:hidden;background:#e2ebeb}progress::-webkit-progress-bar{background:#e2ebeb}progress::-webkit-progress-value{background:var(--teal)}progress::-moz-progress-bar{background:var(--teal)}details{border-top:1px solid var(--line);padding:14px 0}summary{cursor:pointer;font-weight:650}summary .muted{float:right;font-weight:400;font-size:.85rem}.question{padding:14px 0;border-bottom:1px solid var(--line)}.question p{margin:4px 0}.question small{color:var(--muted)}.hint{padding:18px;background:#f1f7f5;border-radius:12px}.empty{padding:18px;background:#f5f8f8;border-radius:12px;color:var(--muted)}button{border:0;border-radius:10px;padding:13px 20px;background:var(--teal);color:white;font:inherit;font-weight:650;cursor:pointer}.footer{font-size:.8rem;color:var(--muted);margin-top:32px}code{overflow-wrap:anywhere}ul{padding-left:22px}.error{background:#fff0ee;border-color:#c24434}.preview-list{display:flex;flex-wrap:wrap;gap:12px;list-style:none;padding:0}.preview-list a{display:block;padding:10px 16px;border:1px solid var(--line);border-radius:10px}nav{display:flex;gap:20px;flex-wrap:wrap;font-size:.9rem}

</style>
