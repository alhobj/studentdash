name: Check ArborSynapse
on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      full_suite:
        description: Full suite (releases or broad changes)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tree/package-lock.json
      - run: pip install -r requirements.txt
      - run: npm ci --prefix tree
      - run: npm run build:all --prefix tree
      - name: Quick checks (5 tests)
        if: ${{ inputs.full_suite != true }}
        run: |
          npm test --prefix tree
          python scripts/check.py
      - name: Full suite (manual)
        if: ${{ inputs.full_suite == true }}
        run: |
          npm run test:full --prefix tree
          python scripts/check.py --full
